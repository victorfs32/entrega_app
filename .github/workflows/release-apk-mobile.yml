name: Build APK Release (React Native)

# Gera o APK do app novo (pasta mobile/), publica no GitHub Releases e grava
# a versão + link do APK no Supabase (configuracoes 'app'). O app lê esse
# registro ao abrir e oferece a atualização — ninguém precisa colar link.

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/release-apk-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-mobile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: npm ci

      - name: Pegar versão do app.json
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v$VERSION" >> "$GITHUB_OUTPUT"

      # versionCode precisa sempre subir, senão o Android recusa instalar
      # por cima. Usa o número da execução do workflow.
      - name: Ajustar versionCode
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json"));
            a.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER) + 100;
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
          '

      - name: Gerar projeto Android
        run: npx expo prebuild -p android --no-install

      - name: Configurar assinatura de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "$ANDROID_KEY_PROPERTIES" > android/key.properties

      - name: Gerar APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Copiar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk entregas.apk

      - name: Criar Release ou atualizar existente
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ github.event.head_commit.message || 'Nova versão do app de entregas.' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" entregas.apk --clobber
          else
            gh release create "$TAG" entregas.apk \
              --latest=false \
              --title "Entregas (React Native) v${{ steps.version.outputs.version }}" \
              --notes "$NOTAS"
          fi
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/entregas.apk" >> "$GITHUB_OUTPUT"

      # Junta com o que já existe (ex.: manutencao) em vez de sobrescrever.
      - name: Publicar versão no Supabase
        env:
          SUPABASE_URL: https://pzlrhmcnnotcheiawvzk.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSAO: ${{ steps.version.outputs.version }}
          APK_URL: ${{ steps.release.outputs.url }}
          NOTAS: ${{ github.event.head_commit.message || 'Nova versão disponível.' }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Secret SUPABASE_SERVICE_ROLE_KEY não configurado; o link não foi publicado no Supabase."
            exit 0
          fi
          REST="$SUPABASE_URL/rest/v1/configuracoes?chave=eq.app"
          AUTH=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          ATUAL=$(curl -fsS "${AUTH[@]}" "$REST&select=dados" | jq '.[0].dados // {}')
          NOVO=$(jq -n --argjson atual "$ATUAL" --arg v "$VERSAO" --arg u "$APK_URL" --arg n "$(echo "$NOTAS" | head -n1)" \
            '{dados: ($atual + {ultimaVersao: $v, apkUrl: $u, notasAtualizacao: $n})}')
          curl -fsS -X PATCH "${AUTH[@]}" -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "$NOVO" "$REST"
          echo "Publicado: v$VERSAO -> $APK_URL"
